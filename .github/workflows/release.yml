name: Build Windows release

# Push a tag like v1.0.0 and GitHub builds Vision360.exe and attaches it to a Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build with PyInstaller
        shell: cmd
        run: build_windows.bat
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\Vision360 -DestinationPath Vision360-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Vision360-windows
          path: Vision360-windows.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Vision360-windows.zip
